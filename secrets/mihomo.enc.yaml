            interval: 300
    dog_providers:
        type: http
        url: ENC[AES256_GCM,data:xITGsQVMTcyW4zHGDa6n8Pas27d33tE/eRwl9rcM5dYfMM7GrTZAk01m1tqdidRQJQ/HPiF1QAicrA//iuZ36k2EekbtqIk1k49kfT35zJg=,iv:L4mu9OQ3mTOmOqvG0otYoM/8JHyV2at0o6nkctfKy3Y=,tag:R9N3bJYPt5Ytl9xmnF2uXQ==,type:str] # sops:enc
        interval: 3600
        proxy: DIRECT
        path: ./providers/dog_providers.yaml
        health-check:
            enable: true
            url: https://cp.cloudflare.com/generate_204
            interval: 300
proxies:
    - name: direct-via-tunRFvnp
      type: direct
      interface-name: tunRFvnp
      routing-mark: 123
    - name: Reality-节点
      type: vless
      server: 8.216.60.74
      port: 443
      uuid: ENC[AES256_GCM,data:S/1XI9xPSbL26yF8heaaIbULm1NN5jvofY+dLKAVCu72HRZW,iv:tGQ7Bqq0gokyjE8KZ1w2cOu48HZIKVasXTnJcuacDdk=,tag:ZVcIcuAAxJQ2gPops41qEQ==,type:str] # sops:enc
      network: tcp
      udp: true
      tls: true
      flow: xtls-rprx-vision
      servername: www.microsoft.com # 对应 serverNames
      reality-opts:
        public-key: ENC[AES256_GCM,data:RyuaQ697pkUcOf6wCaCoVlhJTJ53LJs9ar1zFzknstPP1PtPZJcWRqwr/Q==,iv:mv8sIOrRLDXkyJLketJIzqwV9SXu9ridn91j8w3MCDI=,tag:sQmP87uq4m72Yuw+Sh2d3g==,type:str] # sops:enc
        short-id: ENC[AES256_GCM,data:+/1P42GvyiWM0UnEVMHmgA==,iv:nq2xZphCouRr8dC4TPSbayp4+h9PzlQCgiOKK4lmI+8=,tag:9f7bqgPYsjeOPeNaFlZdRQ==,type:str] # 对应 shortIds # sops:enc
      client-fingerprint: chrome
x-use-providers:
    use:
        - mesl_providers
        - dog_providers
proxy-groups:
    - name: MESL
      type: select
      proxies:
        - MESL_low
        - MESL_no_low
        - MESL_Claude_low
        - Reality
    - name: claude
      type: select
      proxies:
        - MESL_Claude_low
        - MESL_Claude
    - name: MESL_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
            - dog_providers
      url: https://www.gstatic.com/generate_204
      interval: 60
      filter: 0\.3X
    - name: MESL_Claude_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
            - dog_providers
      url: https://www.gstatic.com/generate_204
      interval: 60
      filter: 0\.3X
      exclude-filter: 香港
    - name: MESL_Claude
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
            - dog_providers
      url: https://www.gstatic.com/generate_204
      interval: 60
      filter: 台湾|日本|新加坡
    - name: MESL_no_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
            - dog_providers
      url: https://www.gstatic.com/generate_204
      interval: 120
      exclude-filter: 0\.3X
    - name: RFvpn
      type: select
      proxies:
        - direct-via-tunRFvnp
    - name: Reality
      type: select
      proxies:
        - Reality-节点
