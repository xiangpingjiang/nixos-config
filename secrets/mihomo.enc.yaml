rules:
    - DOMAIN-SUFFIX,dnsleaktest.com,OUT #检测 dns 泄露
    - RULE-SET,private,DIRECT
    # 这几条**绝对不能加 no-resolve**（2026-09-13 加过一次，当场断掉整个公司 VPN 的
    # 域名访问）：公司内网域名（如 bobby-pro-console.bobby.ai）正是靠「解析成 10.x 内网 IP
    # → 匹配这里的 IP-CIDR → 走 RFvpn」这条路。加了 no-resolve 就不做解析、不匹配，
    # 域名一路落到 tld-not-cn（.ai 是非 cn 顶级域）被推去机场，内网当然连不上。
    # 「IP-CIDR 的目标是 IP 字面量所以域名用不到它」这个说法只对纯 IP 目标成立。
    # 代价是每条新连接确实会为比对 IP 先解析一次——这个代价必须付。
    - IP-CIDR,8.134.75.219/32,DIRECT # ← RFvpn connect
    - IP-CIDR,10.65.255.0/24,RFvpn
    - IP-CIDR,10.129.0.0/16,RFvpn
    - IP-CIDR,10.130.0.0/16,RFvpn
    - IP-CIDR,10.131.0.0/16,RFvpn
    - IP-CIDR,42.121.235.3/32,RFvpn
    - IP-CIDR,47.110.241.81/32,RFvpn
    # Claude 官方 + Claude Code + API 全量域名
    - DOMAIN-SUFFIX,anthropic.com,claude
    - DOMAIN-SUFFIX,claude.ai,claude
    - DOMAIN-SUFFIX,claude.com,claude
    # Artifacts/用户内容域名，不在 gfw 列表里，漏了就落到 MATCH 直连（实测 57 条）
    - DOMAIN-SUFFIX,claudeusercontent.com,claude
    # Claude Code 的运行日志上报（二进制里写死），不在任何规则里时落到 MATCH 直连，
    # 切到 claude_cn 后照样带着本地 IP 出去（实测 7 天 185 条）。
    # 用完整域名而不是 datadoghq.com 后缀：那是无数服务共用的后端，理由同下面的 sentry.io
    - DOMAIN,http-intake.logs.us5.datadoghq.com,claude
    # 网页版的同一套 Datadog(RUM),实测 14 天 12 条落到 MATCH 直连
    - DOMAIN,browser-intake-us5-datadoghq.com,claude
    - DOMAIN,logs.browser-intake-us5-datadoghq.com,claude
    # claude.ai 页面 CSP 里列出的 MCP 应用 / live preview 域名，没有规则就落到 tld-not-cn 或直连
    - DOMAIN-SUFFIX,claude.app,claude
    - DOMAIN-SUFFIX,claudemcpcontent.com,claude
    - DOMAIN-SUFFIX,claudemcpclient.com,claude
    # 嵌在 claude.ai 里的第三方风控 / 身份服务：评分或账号身份会回传给 Anthropic,
    # 出口必须和主站一致。2026-10-01 实测 hCaptcha / Turnstile 全部 DIRECT(国内即中国 IP),
    # Intercom 走 OUT 时落过香港节点。代价是别的站用到这几家时也走 claude 出口，可以接受
    # ——和 sentry.io 不同，这几家的数据确实回流到 Anthropic。
    - DOMAIN-SUFFIX,hcaptcha.com,claude
    - DOMAIN,challenges.cloudflare.com,claude
    - DOMAIN-SUFFIX,intercom.io,claude
    - DOMAIN-SUFFIX,intercomcdn.com,claude
    # 登录后打开 Get help 才出现(2026-10-01 实测漏到 DIRECT):realtime 推送、静态资源、附件
    - DOMAIN-SUFFIX,intercom-messenger.com,claude
    - DOMAIN-SUFFIX,intercomassets.com,claude
    - DOMAIN-SUFFIX,intercomusercontent.com,claude
    # Stripe 的风控指纹(只在付款页用到)
    - DOMAIN,m.stripe.network,claude
    - DOMAIN,r.stripe.com,claude
    # OpenAI
    - DOMAIN-SUFFIX,openai.com,claude
    - DOMAIN-SUFFIX,chatgpt.com,claude
    - DOMAIN-SUFFIX,chat.openai.com,claude
    - DOMAIN-SUFFIX,oaistatic.com,claude
    - DOMAIN-SUFFIX,oaiusercontent.com,claude
    - DOMAIN-SUFFIX,openaiapi-site.azureedge.net,claude
    # sentry.io 是无数站点共用的错误上报后端，与 Claude 无关，不要占用 claude 出口
    - DOMAIN-SUFFIX,sentry.io,OUT
    # nixos
    - DOMAIN-SUFFIX,nixos.org,OUT
    - DOMAIN-SUFFIX,numtide.com,OUT
    - DOMAIN-SUFFIX,cachix.org,OUT
    # infini
    - DOMAIN-SUFFIX,infini-cloud.net,OUT
    # rockflow
    - DOMAIN-SUFFIX,rockflow.ai,DIRECT
    - DOMAIN,in.mesl.cloud,MESL
    - RULE-SET,reject,REJECT
    - RULE-SET,tld-not-cn,OUT
    - RULE-SET,gfw,OUT
    - RULE-SET,telegramcidr,OUT
    - DOMAIN,img.notionusercontent.com,OUT
    - MATCH,DIRECT
