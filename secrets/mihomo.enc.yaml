# 记住 OUT / 各 selector 的手动选择，重启不丢
profile:
    store-selected: true
proxy-groups:
    # 低倍率(0.3X)优先:省流量,而且实测出口画像反而更干净
    # (台湾 01 / 日本 01 都是 proxy=false,而 no_low 常落在 GSL Networks 那批 proxy=true 上)。
    # fallback 而不是 select:low 组整体不可用时自动回落 no_low,不用人管;
    # 仍然接受手动 PUT,想强制某一层随时可以。
    - name: MESL
      type: fallback
      url: https://www.gstatic.com/generate_204
      interval: 60
      proxies:
        - MESL_low
        - MESL_no_low
    # 目的是给 Claude 一个干净且合规的出口，不是求快：
    #   新加坡（Anthropic 支持地区）→ DIRECT，住宅/移动 IP，proxy=false hosting=false
    #   中国（不在支持地区）→ 降级到机场，代理层先用 0.3X 低倍率组：省流量，而且
    #     实测低倍率节点的出口画像反而更好（2026-09-12，国内）：
    #       台湾 01 [0.3X] 103.208.196.123  proxy=false hosting=true   Sky Digital
    #       日本 01 [0.3X] 31.223.184.105   proxy=false hosting=false  G-Core Labs
    #       对照 no_low 日本 06 103.62.49.147 proxy=true hosting=true  GSL Networks
    #     现在两层都只留日本（正向 filter 白名单，香港/中国大陆不在支持地区，不会混进来）。
    #     低倍率组整体挂了会自动回落 MESL_Claude，出口仍在日本。
    #   健康检查可能误判，落地后必须手动核对一次：
    #   curl -s 127.0.0.1:9097/proxies/claude  国内必须显示 claude_cn（netloc cn 会核对）
    # 外层是 select：**绝不能用 fallback**。mihomo 的 fallback 在所有成员探测失败时
    # 回落到 proxies[0]，而 DIRECT 在国内对 gstatic 恒 Timeout —— 2026-09-13 19:33
    # 就这么漏过 21 条 `using claude[DIRECT]` 到 api.anthropic.com，全是中国 IP。
    # select 不做健康检查、只认手动选择，全灭时停在机场层连不通（fail-closed）。
    - name: claude
      type: select
      proxies:
        - claude_cn
        - DIRECT
    # 机场层的自动降级放这里：low 挂了自己切 no_low，但无论如何出不去 DIRECT
    - name: claude_cn
      type: fallback
      proxies:
        - MESL_Claude_low
        - MESL_Claude
      url: https://www.gstatic.com/generate_204
      interval: 60
    # 地点开关：回国选 MESL，在新加坡选 DIRECT。切一次，出境规则全跟着走
    - name: OUT
      type: select
      proxies:
        - MESL
        - DIRECT
    - name: MESL_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
      url: https://www.gstatic.com/generate_204
      interval: 60
      filter: 0\.3X
    # 正向 filter 而不是 exclude 香港：只有列出的支持地区能进来。
    # 反向写法在机场新增不支持地区的 0.3X 节点时会自动放行。
    - name: MESL_Claude_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
      url: https://www.gstatic.com/generate_204
      interval: 300
      # tolerance(毫秒):新节点要比当前节点快 10s 以上才切。三个候选彼此只差几十毫秒,
      # 不设它就是每分钟换一次出口 IP —— 风控看到的是同一个会话在数据中心之间反复跳,
      # 和有人重放偷来的 token 长得一样(2026-09-18 Anthropic 那封 suspicious activity)。
      # 当前节点真死了仍会立刻换:urltest.go 的判据里 !AliveForTestUrl 是独立的一条。
      tolerance: 10000
      # 只留日本。实测三个候选的风控画像:日本 01 [0.3X] 是唯一 proxy=false + hosting=false,
      # 台湾 01 hosting=true,新加坡 01 两项都 true。而日本 01 恰好最慢(121ms vs 台湾 77ms),
      # 光加 tolerance 会把链路锁死在台湾上,必须同时把候选缩到画像最好的这一批。
      # 仍是正向白名单:加地区要显式改这一行,机场新增不支持地区的节点不会自动混进来。
      filter: 日本.*0\.3X
    # exclude 掉 0.3X：不和 MESL_Claude_low 共享成员。否则两层的 url-test 会挑中
    # 同一个最快节点，那一个节点抖动就让两层同时判死（19:33 那次就是台湾 01 同时占着两层）。
    - name: MESL_Claude
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
      url: https://www.gstatic.com/generate_204
      interval: 300
      # 同上:这层是 low 全灭时的兜底,30 个候选之间的延迟差更大,更需要 tolerance 压住抖动
      tolerance: 10000
      # 只留日本:和 MESL_Claude_low 同一个国家。low 那个节点挂了回落到这层时,
      # 出口仍在日本,不会跨国跳(跨国换 IP 正是 09-18 那封 suspicious activity 的诱因)。
      filter: 日本
      exclude-filter: 0\.3X
    - name: MESL_no_low
      type: url-test
      !!merge <<:
        use:
            - mesl_providers
      url: https://www.gstatic.com/generate_204
      interval: 120
      exclude-filter: 0\.3X
    - name: RFvpn
      type: select
      proxies:
        - direct-via-tunRFvnp
